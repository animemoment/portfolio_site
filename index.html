<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артиллерийский Симулятор</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Компактный интерфейс (справа, не закрывает пушку) -->
    <div class="ui-overlay" id="uiOverlay">
        <div class="ui-header">
            <h2>🎯 Артиллерия</h2>
            <button id="toggleUIBtn" class="toggle-btn">📋</button>
        </div>
        
        <div class="ui-content" id="uiContent">
            <div class="control-group">
                <label>📐 Угол: <span id="angleValue">45</span>°</label>
                <input type="range" id="angleSlider" min="0" max="90" value="45">
            </div>
            
            <div class="control-group">
                <label>💪 Сила: <span id="powerValue">70</span>%</label>
                <input type="range" id="powerSlider" min="10" max="100" value="70">
            </div>
            
            <div class="control-group">
                <label>💨 Ветер: <span id="windValue">0</span></label>
                <div class="wind-display">
                    <span id="windDirection">↔</span>
                    <span id="windValueText">0</span>
                </div>
            </div>
            
            <div class="control-group">
                <label>🔫 Снаряд</label>
                <select id="ammoType">
                    <option value="normal">Обычный</option>
                    <option value="heavy">Тяжёлый</option>
                    <option value="explosive">Фугасный</option>
                </select>
            </div>
            
            <button id="fireBtn" class="fire-btn">🔥 ОГОНЬ!</button>
            <button id="resetBtn" class="reset-btn">🔄 Заново</button>
            
            <div class="stats">
                <div class="stat-row">
                    <span>💥 Выстрелов:</span>
                    <b id="shotsCount">0</b>
                </div>
                <div class="stat-row">
                    <span>🎯 Попаданий:</span>
                    <b id="hitsCount">0</b>
                </div>
                <div class="stat-row">
                    <span>🏢 Разрушено:</span>
                    <b id="buildingsDestroyed">0</b>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Статистика полёта (отдельно, сверху) -->
    <div class="flight-stats" id="flightStats">
        <span>📏 Дальность: <b id="rangeDisplay">0</b>м</span>
        <span>📈 Высота: <b id="heightDisplay">0</b>м</span>
        <span>⏱️ Время: <b id="flightTime">0</b>с</span>
    </div>
    
    <!-- Мини-карта (внизу справа) -->
    <div class="minimap-container">
        <canvas id="minimap"></canvas>
    </div>
    
    <!-- Канвас для игры -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Сообщение о попадании -->
    <div id="hitMessage" class="hit-message"></div>
    
    <!-- Экран победы -->
    <div id="gameOverScreen" class="game-over-screen">
        <h2 id="gameOverTitle">🎯 МИССИЯ ВЫПОЛНЕНА!</h2>
        <p id="gameOverStats"></p>
        <button id="restartBtn" class="restart-btn">🔄 Новая миссия</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
